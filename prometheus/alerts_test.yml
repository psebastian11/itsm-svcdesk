# ai-generated: 100% - tests pin both sides of each alert's first firing evaluation
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42427.2+427.2x60'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 172.8+172.8x60'
    alert_rule_test:
      - eval_time: 99m
        alertname: KbSearchAvailabilityBurnFast
        exp_alerts: []
      - eval_time: 100m
        alertname: KbSearchAvailabilityBurnFast
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1
            exp_annotations:
              summary: "GET /kb/search is consuming its availability budget rapidly"

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x370 222528+528x230'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x370 72+72x230'
    alert_rule_test:
      - eval_time: 549m
        alertname: KbSearchAvailabilityBurnSlow
        exp_alerts: []
      - eval_time: 550m
        alertname: KbSearchAvailabilityBurnSlow
